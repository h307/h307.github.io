  if (cats.includes('threat:real_world')) notes.push('HIGH SEVERITY: real-world threat. Report it in Roblox, and to police if there is any danger.');
  if (band === '13-17' && mode === 'public') notes.push('REPORTED (Research Bot, unverified): 13-17 public chat uses the same filter as under-13. The extra under-13 number rule here comes from a 2022 Roblox page.');
  const signals = groomSignals(history.concat([text]));
  const grooming_flag = { flagged: signals.length > 0, level: signals.length >= 2 ? 'high' : signals.length ? 'watch' : 'none', signals };
  if (grooming_flag.level === 'high') notes.push('Grooming-pattern warning: several risk signals across recent messages (Sentinel-style heuristic; REPORTED and GUESS).');
  const robloxVerdict = {
    allowed: 'Likely shown as typed.',
    rephrased: 'Likely shown with the swearing removed by Roblox\'s AI rephraser.',
    hashed: 'Likely shown with the flagged words as ####.',
    blocked_not_sent: 'Likely blocked: the sender sees ####, the recipient sees nothing.',
  }[outcome] + ' [band ' + band + ', ' + mode + ' chat]';
  return { outcome, displayed, categories: cats, decoded: decodedView(det.toks, spans.filter(s => s.start < text.length)), robloxVerdict, grooming_flag, notes };
}
return { filterMessage, normBand };
})()
/*ENGINE-END*/
;
</script>
<script>
(function(){
  var input=document.getElementById('in'), out=document.getElementById('out');
  function project(text){
    if(!text) return '';
    var r=window.ENGINE.filterMessage(text,{band:'13-17',mode:'public',history:[],strongLanguage:false});
    if(r.outcome==='blocked_not_sent') return '#### (blocked, not sent)';
    if(r.outcome==='rephrased') return r.displayed+' (rephrased)';
    return r.displayed;
  }
  function update(){ out.textContent=project(input.value); }
  input.addEventListener('input',update);
  update();
})();
</script>
